<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sample Site</title>
  </head>
  <body>
  <h1>Sample Site</h1>
    <p id="welcome">Hello, Thank you for accessing to this website.</p>
    <button onclick="swapWelcome()">Greeting!</button>

    <script>
    function swapWelcome() {
      var welcomeMessage = document.getElementById("welcome");
      var isTest = (typeof navigator !== 'undefined' && navigator.webdriver) || window.__TEST__ === true;

      // In tests, remove randomness for determinism
      var delay = isTest ? 0 : (Math.random() < 0.3 ? Math.random() * 200 : 0);

      setTimeout(function() {
        // Skip simulated JS errors during tests
        if (!isTest && Math.random() < 0.05) {
          console.error("Simulated JavaScript error");
          return;
        }

        welcomeMessage.innerHTML = "Hi, Thank you for touch me!";
      }, delay);
    }
    </script>
  </body>
</html>
